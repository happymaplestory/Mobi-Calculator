<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobi Calculator 개발 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --page-background: #ffffff;
      --text-color: #242424;
      --surface-color: #ffffff;
      --border-color: #d5d5d5;
      --dialog-backdrop: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    body {
      margin: 20px;
      background: var(--page-background);
      color: var(--text-color);
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    h1, h2 { line-height: 1.4; }

 .rune-test-box {
      box-sizing: border-box; display: flex; flex-direction: column; gap: 0;
      width: 350px; height: 750px; max-width: 100%; overflow: auto;
      scrollbar-width: none; -ms-overflow-style: none;
      padding: 12px; border: 1px solid var(--border-color, #c9c9c9);
      border-radius: 10px; background: var(--surface-color, #fff);
    }
    .rune-test-box::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .rune-controls { display: grid; gap: 10px; margin: 0 0 14px; flex: 0 0 auto; }
    .rune-filter-row { display: flex; flex-wrap: nowrap; gap: 5px; width: 100%; max-width: 350px; }
    .rune-filter {
      flex: 1 1 0; min-width: 0; min-height: 34px; padding: 6px 4px; border: 1px solid #c9c9c9;
      border-radius: 8px; background: #f5f5f5; color: #333; font: inherit;
      cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease;
    }
    .rune-filter[aria-pressed="true"] { background: #e5e5e5; border-color: #777; font-weight: 600; }
    .rune-search-row { display: flex; align-items: stretch; gap: 7px; min-width: 0; }
    #rune-search { flex: 1 1 auto; min-width: 0; height: 40px; padding: 8px 11px; border: 1px solid #bdbdbd; border-radius: 8px; background: #fff; color: #222; font: inherit; }
    .rune-sort-button { display: inline-flex; align-items: center; justify-content: center; gap: 3px; flex: 0 0 48px; min-width: 48px; border: 1px solid #bdbdbd; border-radius: 8px; background: #f5f5f5; color: #222; font: inherit; cursor: pointer; }
    .rune-sort-button[aria-pressed="true"] { background: #e5e5e5; border-color: #777; }
    .rune-sort-glyph { font-size: 20px; line-height: 1; }
    .rune-sort-triangle { align-self: center; font-size: 9px; line-height: 1; }
    #rune-pagination {
      position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 5px; flex: 0 0 auto; max-height: 80px; margin-top: 14px; overflow: visible;
      transition: max-height 260ms ease, margin-top 260ms ease;
    }
    #rune-pagination.is-empty { max-height: 0; margin-top: 0; pointer-events: none; }
    .rune-pagination-exit { position: absolute; z-index: 1; margin: 0; pointer-events: none; will-change: transform, opacity; }
    .rune-page-button { min-width: 32px; height: 32px; padding: 0 7px; border: 1px solid #d0d0d0; border-radius: 7px; background: #fff; color: #222; font: inherit; cursor: pointer; }
    .rune-page-button[aria-current="page"] { background: #e5e5e5; border-color: #777; font-weight: 700; }
    .rune-page-button:disabled { opacity: .38; cursor: default; }
    .rune-page-ellipsis { padding: 0 2px; color: #777; }
    .rune-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    #rune-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    #rune-table th,
    #rune-table td {
      padding: 9px 10px;
      border: 1px solid var(--rune-border, #d5d5d5);
      text-align: left;
      overflow-wrap: anywhere;
    }

    #rune-table th {
      background: #f2f2f2;
      font-weight: 600;
    }

    #rune-table .rune-slot,
    #rune-table th:first-child {
      width: 60px;
      min-width: 60px;
      max-width: 60px;
      padding-right: 2px;
      padding-left: 2px;
      text-align: center;
      white-space: nowrap;
      overflow-wrap: normal;
    }

    #rune-table .rune-name {
      width: auto;
      font-weight: 600;
    }

    #rune-table tbody tr {
      cursor: pointer;
      transition: filter 140ms ease;
    }

    #rune-table tbody tr[data-grade="전설"] {
      --rune-background: #fff0df;
      --rune-border: #e9bd91;
    }

    #rune-table tbody tr[data-grade="신화"] {
      --rune-background: #fffbd8;
      --rune-border: #e6d77b;
    }

    #rune-table tbody tr {
      background: var(--rune-background, #ffffff);
    }

    #rune-table tbody tr:hover {
      filter: brightness(0.97);
    }

    .rune-description-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--dialog-backdrop);
      animation: rune-backdrop-in 220ms ease both;
    }

    .rune-description-dialog {
      box-sizing: border-box;
      width: min(100%, 420px);
      max-height: min(80vh, 680px);
      overflow-y: auto;
      padding: 22px;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      background: var(--surface-color);
      color: var(--text-color);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
      animation: rune-dialog-in 220ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    .rune-description-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .rune-description-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .rune-description-meta {
      margin: 5px 0 0;
      color: #777777;
      font-size: 13px;
    }

    .rune-description-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.65;
    }

    .rune-description-close {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .rune-description-close:hover {
      background: rgba(127, 127, 127, 0.12);
    }

    [hidden] { display: none !important; }

    @keyframes rune-backdrop-in {
      from { background-color: rgba(0, 0, 0, 0); }
      to { background-color: var(--dialog-backdrop); }
    }

    @keyframes rune-dialog-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #rune-table tbody tr,
      .rune-description-overlay,
      #rune-pagination, .rune-page-button, .rune-page-ellipsis, .rune-pagination-exit {
        animation: none !important;
        transition: none !important;
      }
      .rune-description-dialog {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <h1>마비노기 모바일 계산기 개발 테스트</h1>
  <p>이 페이지는 다른 웹페이지의 기능을 실제 페이지에 반영하기 전에 HTML, CSS, JavaScript 및 브라우저 동작을 테스트하기 위한 개발 테스트 환경입니다.</p>

<section class="rune-test-box" aria-label="룬 검색 및 결과 테스트 영역">
  <section class="rune-controls" aria-label="룬 검색 및 필터">
    <div class="rune-filter-row" aria-label="등급 필터">
      <button class="rune-filter" type="button" data-filter-group="grade" data-filter-value="신화" aria-pressed="true">신화</button>
      <button class="rune-filter" type="button" data-filter-group="grade" data-filter-value="전설" aria-pressed="true">전설</button>
      <button class="rune-filter" type="button" data-filter-group="slot" data-filter-value="무기" aria-pressed="true">무기</button>
      <button class="rune-filter" type="button" data-filter-group="slot" data-filter-value="방어구" aria-pressed="true">방어구</button>
      <button class="rune-filter" type="button" data-filter-group="slot" data-filter-value="엠블럼" aria-pressed="true">엠블럼</button>
    </div>
    <div class="rune-search-row">
      <input id="rune-search" type="search" placeholder="룬 이름 또는 설명 검색" aria-label="룬 이름 또는 설명 검색">
      <button id="rune-sort-toggle" class="rune-sort-button" type="button" aria-label="정렬 순서: 가나다순. 눌러서 가나다 역순으로 변경" aria-pressed="false"><span class="rune-sort-glyph">≡</span><span id="rune-sort-triangle" class="rune-sort-triangle">▽</span></button>
    </div>
  </section>
  <div class="rune-table-wrap">
    <table id="rune-table">
      <thead>
        <tr>
          <th scope="col">slot</th>
          <th scope="col">name</th>
        </tr>
      </thead>
      <tbody id="rune-table-body"></tbody>
    </table>
  </div>
  <nav id="rune-pagination" class="is-empty" aria-label="룬 검색 결과 페이지" aria-hidden="true"></nav>
  </section>

  <div id="rune-description-overlay" class="rune-description-overlay" hidden>
    <section class="rune-description-dialog" role="dialog" aria-modal="true" aria-labelledby="rune-description-title" aria-describedby="rune-description-text">
      <div class="rune-description-heading">
        <div>
          <h2 id="rune-description-title" class="rune-description-title"></h2>
          <p id="rune-description-meta" class="rune-description-meta"></p>
        </div>
        <button id="rune-description-close" class="rune-description-close" type="button" aria-label="설명 팝업 닫기">×</button>
      </div>
      <p id="rune-description-text" class="rune-description-text"></p>
    </section>
  </div>

  <script type="module">
    import { RUNES } from "./pages_js/runes-data.js";

    const tableBody = document.getElementById("rune-table-body");
const overlay = document.getElementById("rune-description-overlay");
    const dialogTitle = document.getElementById("rune-description-title");
    const dialogMeta = document.getElementById("rune-description-meta");
    const dialogText = document.getElementById("rune-description-text");
    const closeButton = document.getElementById("rune-description-close");

    function closeDescription() {
      overlay.hidden = true;
    }

    function openDescription(rune) {
      dialogTitle.textContent = rune.name ?? "";
      dialogMeta.textContent = rune.slot ?? "";
      dialogText.textContent = rune.desc ?? "";
      overlay.hidden = false;
      closeButton.focus();
    }

    const searchInput = document.getElementById("rune-search");
    const pagination = document.getElementById("rune-pagination");
    const sortToggleButton = document.getElementById("rune-sort-toggle");
    const sortTriangle = document.getElementById("rune-sort-triangle");
    const PAGE_SIZE = 10;
    const activeFilters = {
      grade: new Set(["신화", "전설"]),
      slot: new Set(["무기", "방어구", "엠블럼"])
    };
    let sortDirection = "asc";
    let currentPage = 1;

    function getFilteredRunes() {
      const query = searchInput.value.trim().toLocaleLowerCase("ko-KR");
      return RUNES.items
        .filter(rune => activeFilters.grade.has(rune.grade) && activeFilters.slot.has(rune.slot))
        .filter(rune => !query || `${rune.name ?? ""} ${rune.desc ?? ""}`.toLocaleLowerCase("ko-KR").includes(query))
        .sort((a, b) => {
          const result = (a.name ?? "").localeCompare(b.name ?? "", "ko-KR");
          return sortDirection === "asc" ? result : -result;
        });
    }

    function createPageButton(label, page, options = {}) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "rune-page-button";
      button.textContent = label;
      if (options.current) button.setAttribute("aria-current", "page");
      if (options.disabled) button.disabled = true;
      if (!options.disabled && !options.current) button.addEventListener("click", () => {
        currentPage = page;
        renderRunes();
      });
      return button;
    }

    function renderPagination(totalPages) {
      const nextNodes = [];
      const isEmpty = totalPages <= 1;
      const oldRect = pagination.getBoundingClientRect();
      pagination.setAttribute("aria-hidden", String(isEmpty));

      if (!isEmpty) {
        nextNodes.push(createPageButton("<", currentPage - 1, { disabled: currentPage === 1 }));
        nextNodes.push(createPageButton("1", 1, { current: currentPage === 1 }));

        if (currentPage > 3) {
          const ellipsis = document.createElement("span");
          ellipsis.className = "rune-page-ellipsis";
          ellipsis.textContent = "...";
          nextNodes.push(ellipsis);
        }

        if (currentPage > 1 && currentPage < totalPages) {
          if (currentPage - 1 > 1) nextNodes.push(createPageButton(String(currentPage - 1), currentPage - 1));
          nextNodes.push(createPageButton(String(currentPage), currentPage, { current: true }));
          if (currentPage + 1 < totalPages) nextNodes.push(createPageButton(String(currentPage + 1), currentPage + 1));
        } else if (currentPage === 1 && totalPages > 2) {
          nextNodes.push(createPageButton("2", 2));
        } else if (currentPage === totalPages && totalPages > 2) {
          nextNodes.push(createPageButton(String(totalPages - 1), totalPages - 1));
        }

        if (currentPage < totalPages - 2) {
          const ellipsis = document.createElement("span");
          ellipsis.className = "rune-page-ellipsis";
          ellipsis.textContent = "...";
          nextNodes.push(ellipsis);
        }
        nextNodes.push(createPageButton(String(totalPages), totalPages, { current: currentPage === totalPages }));
        nextNodes.push(createPageButton(">", currentPage + 1, { disabled: currentPage === totalPages }));
      }

      const oldNodes = [...pagination.children].filter(node => !node.classList.contains("rune-pagination-exit"));
      const getNodeKey = node => node.textContent + "|" + node.className;
      const oldRectsByKey = new Map();
      for (const node of oldNodes) {
        const key = getNodeKey(node);
        if (!oldRectsByKey.has(key)) oldRectsByKey.set(key, []);
        oldRectsByKey.get(key).push(node.getBoundingClientRect());
      }
      const oldKeys = new Set(oldNodes.map(getNodeKey));
      const nextKeys = new Set(nextNodes.map(getNodeKey));
      const outgoing = [];

      for (const node of oldNodes) {
        if (nextKeys.has(getNodeKey(node))) continue;
        const rect = node.getBoundingClientRect();
        const clone = node.cloneNode(true);
        const computed = getComputedStyle(node);
        Object.assign(clone.style, {
          left: `${rect.left - oldRect.left}px`, top: `${rect.top - oldRect.top}px`,
          width: `${rect.width}px`, height: `${rect.height}px`,
          boxSizing: "border-box", font: computed.font
        });
        clone.classList.add("rune-pagination-exit");
        outgoing.push(clone);
      }

      pagination.replaceChildren(...nextNodes, ...outgoing);
      pagination.classList.toggle("is-empty", isEmpty);
      for (const clone of outgoing) {
        clone.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: 260, easing: "ease-out", fill: "forwards" }
        ).onfinish = () => clone.remove();
      }
      requestAnimationFrame(() => {
        for (const node of nextNodes) {
          const key = getNodeKey(node);
          const previousRects = oldRectsByKey.get(key);
          if (previousRects?.length) {
            const previousRect = previousRects.shift();
            const nextRect = node.getBoundingClientRect();
            const dx = previousRect.left - nextRect.left;
            const dy = previousRect.top - nextRect.top;
            if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) {
              node.animate(
                [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0, 0)" }],
                { duration: 260, easing: "cubic-bezier(.22,.72,.22,1)" }
              );
            }
          } else if (!oldKeys.has(key)) {
            node.animate(
              [{ opacity: 0 }, { opacity: 1 }],
              { duration: 260, easing: "ease-out", fill: "both" }
            );
          }
        }
      });
    }

    function renderRunes() {
      const box = document.querySelector(".rune-test-box");
      const layoutBefore = [...box.children].map(element => ({ element, rect: element.getBoundingClientRect() }));
      const filtered = getFilteredRunes();
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      currentPage = Math.max(1, Math.min(currentPage, totalPages || 1));
      const visibleRunes = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
      tableBody.replaceChildren();

      for (const rune of visibleRunes) {
        const row = document.createElement("tr");
        row.dataset.grade = rune.grade ?? "";
        row.tabIndex = 0;
        row.setAttribute("aria-label", `${rune.name ?? "이름 없는 룬"} 설명 보기`);

        const slotCell = document.createElement("td");
        slotCell.className = "rune-slot";
        slotCell.textContent = rune.slot ?? "";

        const nameCell = document.createElement("td");
        nameCell.className = "rune-name";
        nameCell.textContent = rune.name ?? "";

        row.append(slotCell, nameCell);
        row.addEventListener("click", () => openDescription(rune));
        row.addEventListener("keydown", event => {
          if (event.target !== row || (event.key !== "Enter" && event.key !== " ")) return;
          event.preventDefault();
          openDescription(rune);
        });
        tableBody.appendChild(row);
      }

renderPagination(totalPages);

      // FLIP: only surrounding elements move smoothly when the pagination area expands or collapses.
      requestAnimationFrame(() => {
        for (const { element, rect } of layoutBefore) {
          if (!element.isConnected) continue;
          const nextRect = element.getBoundingClientRect();
          const dx = rect.left - nextRect.left;
          const dy = rect.top - nextRect.top;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
          element.animate(
            [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0, 0)" }],
            { duration: 260, easing: "cubic-bezier(.22,.72,.22,1)" }
          );
        }
      });
    }

    document.querySelectorAll("[data-filter-group]").forEach(button => {
      button.addEventListener("click", () => {
        const group = button.dataset.filterGroup;
        const value = button.dataset.filterValue;
        if (activeFilters[group].has(value)) activeFilters[group].delete(value);
        else activeFilters[group].add(value);
        button.setAttribute("aria-pressed", String(activeFilters[group].has(value)));
        currentPage = 1;
        renderRunes();
      });
    });

    searchInput.addEventListener("input", () => {
      currentPage = 1;
      renderRunes();
    });

    sortToggleButton.addEventListener("click", () => {
      sortDirection = sortDirection === "asc" ? "desc" : "asc";
      sortTriangle.textContent = sortDirection === "asc" ? "▽" : "△";
      sortToggleButton.setAttribute("aria-pressed", String(sortDirection === "desc"));
      sortToggleButton.setAttribute("aria-label", sortDirection === "asc"
        ? "정렬 순서: 가나다순. 눌러서 가나다 역순으로 변경"
        : "정렬 순서: 가나다 역순. 눌러서 가나다순으로 변경");
      currentPage = 1;
      renderRunes();
    });

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeDescription();
    });
    closeButton.addEventListener("click", closeDescription);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !overlay.hidden) closeDescription();
    });

    renderRunes();
  </script>
</body>
</html>
