<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobi Calculator 개발 테스트</title>
  <style>
    :root {
      --field-height: 38px;
      --row-height: 38px;
      --field-radius: 10px;
      --border-color: #8f8f8f;
      --border-width: 2px;
      --background-color: #f5f5f5;
      --surface-color: #ffffff;
      --text-color: #222222;
      --hover-color: #eeeeee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-width: 700px;
      min-height: 700px;
      background: var(--background-color);
      color: var(--text-color);
      font-family: Arial, "Noto Sans KR", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 28px;
    }

    .test-area {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 24px;
    }

    .category-group {
      display: grid;
      padding: 16px;
      border: var(--border-width) solid var(--border-color);
      border-radius: 16px;
      background: var(--surface-color);
      grid-template-columns: var(--category-column-width) var(--description-column-width) 130px 42px;
      gap: 8px;
    }

    .input-row,
    .optional-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: var(--category-column-width) var(--description-column-width) 130px 42px;
      gap: 8px;
      min-height: var(--row-height);
      border-radius: var(--field-radius);
      background: transparent;
      transition: transform 120ms ease;
    }

    .input-row:hover,
    .optional-row:hover {
      background: var(--hover-color);
    }

    .optional-row {
      cursor: grab;
      touch-action: none;
    }

    .optional-row.dragging {
      position: fixed;
      z-index: 1000;
      margin: 0;
      pointer-events: none;
      cursor: grabbing;
      transition: none;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .optional-row.dragging:hover {
      background: var(--surface-color);
    }

    .drag-placeholder {
      grid-column: 1 / -1;
      min-height: var(--row-height);
      border-radius: var(--field-radius);
      background: var(--hover-color);
      opacity: 0.55;
    }

    .field,
    .value-input,
    .action-button {
      min-height: var(--field-height);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--field-radius);
      background: var(--surface-color);
      color: var(--text-color);
      font: inherit;
    }

    .field {
      display: flex;
      align-items: center;
      padding: 0 14px;
      white-space: nowrap;
    }

    select.field {
      appearance: auto;
      padding-right: 32px;
      cursor: pointer;
    }

    .value-input {
      width: 130px;
      padding: 0 12px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .field:hover,
    .action-button:hover,
    .category-group:hover {
      background: var(--hover-color);
    }

    .value-input:hover {
      background: var(--hover-color);
    }

    .value-input:focus,
    select.field:focus {
      border-color: #777777;
    }

    .action-button {
      width: 42px;
      padding: 0;
      cursor: pointer;
      background: var(--surface-color);
    }

    .delete-button {
      font-size: 20px;
      line-height: 1;
    }

    .add-button {
      grid-column: 1 / -1;
      width: 42px;
      font-size: 24px;
      line-height: 1;
    }

    .required-placeholder {
      min-height: var(--field-height);
    }
  </style>
</head>
<body>
  <h1>마비노기 모바일 계산기 개발 테스트</h1>

  <div id="test-area" class="test-area"></div>

  <script src="test-data.js"></script>
  <script>
    const groups = new Map();
    let dragState = null;
    let pendingDrag = null;
    function setColumnWidths() {
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      context.font = '16px Arial, "Noto Sans KR", sans-serif';

      const categoryTexts = CALCULATOR_DATA.categories;
      const descriptionTexts = [
        ...Object.values(CALCULATOR_DATA.requiredDescriptions).flat(),
        ...Object.values(CALCULATOR_DATA.optionalDescriptions).flat()
      ];

      const categoryWidth = Math.ceil(
        Math.max(...categoryTexts.map(text => context.measureText(text).width)) + 80
      );
      const descriptionWidth = Math.ceil(
        Math.max(...descriptionTexts.map(text => context.measureText(text).width)) + 60
      );

      document.documentElement.style.setProperty(
        "--category-column-width",
        categoryWidth + "px"
      );
      document.documentElement.style.setProperty(
        "--description-column-width",
        descriptionWidth + "px"
      );
    }

    function createGroup(category) {
      const group = document.createElement("div");
      group.className = "category-group";
      group.dataset.category = category;
      groups.set(category, group);
      document.getElementById("test-area").appendChild(group);
      return group;
    }

    function createSelect(options, selectedValue, onChange) {
      const select = document.createElement("select");
      select.className = "field";

      options.forEach(optionText => {
        const option = document.createElement("option");
        option.value = optionText;
        option.textContent = optionText;
        select.appendChild(option);
      });

      select.value = selectedValue;
      select.addEventListener("change", onChange);
      return select;
    }

    function createValueInput() {
      const input = document.createElement("input");
      input.className = "value-input";
      input.type = "text";
      input.inputMode = "decimal";
      input.setAttribute("aria-label", "값 입력");
      return input;
    }

    function createRequiredRow(item) {
      const row = document.createElement("div");
      row.className = "input-row";

      const category = document.createElement("div");
      category.className = "field";
      category.textContent = item.category;

      const description = document.createElement("div");
      description.className = "field";
      description.textContent = item.description;

      const layoutPlaceholder = document.createElement("div");
      layoutPlaceholder.className = "required-placeholder";

      row.append(category, description, createValueInput(), layoutPlaceholder);
      return row;
    }

    function renumberOptionalRows(category) {
      const group = groups.get(category);

      if (!group) {
        return;
      }

      const occurrenceCounts = new Map();
      const rows = group.querySelectorAll(".optional-row");

      rows.forEach(row => {
        const descriptionSelect = row.children[1];
        const baseDescription =
          descriptionSelect.dataset.baseDescription || descriptionSelect.value;

        const occurrence = (occurrenceCounts.get(baseDescription) || 0) + 1;
        occurrenceCounts.set(baseDescription, occurrence);

        Array.from(descriptionSelect.options).forEach(option => {
          option.textContent = option.value;
        });

        const selectedOption = descriptionSelect.options[descriptionSelect.selectedIndex];

        if (selectedOption) {
          selectedOption.textContent =
            `${baseDescription} (${occurrence})`;
        }
      });
    }

    function getOptionalRows(group) {
      return Array.from(group.querySelectorAll(".optional-row:not(.dragging)"));
    }

    function getDragTarget(group, pointerY, draggedRow) {
      const rows = getOptionalRows(group);
      let closestRow = null;
      let closestDistance = Infinity;

      rows.forEach(row => {
        const rect = row.getBoundingClientRect();
        const distance = Math.abs(pointerY - (rect.top + rect.height / 2));

        if (distance < closestDistance) {
          closestDistance = distance;
          closestRow = row;
        }
      });

      if (!closestRow) {
        return null;
      }

      const rect = closestRow.getBoundingClientRect();
      return pointerY < rect.top + rect.height / 2
        ? closestRow
        : closestRow.nextElementSibling;
    }

    function startOptionalDrag(row, event) {
      if (event.button !== 0 || dragState || pendingDrag) {
        return;
      }

      pendingDrag = {
        row,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY
      };
    }

    function beginOptionalDrag(row, event) {
      if (!pendingDrag || pendingDrag.row !== row) {
        return;
      }

      const rect = row.getBoundingClientRect();
      const placeholder = document.createElement("div");
      placeholder.className = "drag-placeholder";
      placeholder.style.height = rect.height + "px";

      row.parentElement.insertBefore(placeholder, row);

      row.classList.add("dragging");
      row.style.width = rect.width + "px";
      row.style.height = rect.height + "px";
      row.style.left = rect.left + "px";
      row.style.top = rect.top + "px";

      dragState = {
        row,
        placeholder,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top,
        group: row.parentElement,
        category: row.children[0].value
      };

      document.body.setPointerCapture?.(event.pointerId);
    }

    function updateOptionalDrag(event) {
      if (!dragState) {
        if (!pendingDrag || pendingDrag.row === event.currentTarget) {
          if (pendingDrag && pendingDrag.row === event.currentTarget) {
            const dx = event.clientX - pendingDrag.startX;
            const dy = event.clientY - pendingDrag.startY;
            if (Math.hypot(dx, dy) >= 6) {
              const row = pendingDrag.row;
              pendingDrag = null;
              beginOptionalDrag(row, event);
            }
          }
        }
      }

      if (!dragState) {
        return;
      }

      const { row, placeholder, group, offsetX, offsetY } = dragState;
      row.style.left = event.clientX - offsetX + "px";
      row.style.top = event.clientY - offsetY + "px";

      const target = getDragTarget(group, event.clientY, row);

      if (!target || target === placeholder) {
        return;
      }

      if (target !== row && target !== placeholder.nextElementSibling) {
        const rowsBefore = getOptionalRows(group);
        const positions = new Map(
          rowsBefore.map(item => [item, item.getBoundingClientRect().top])
        );

        group.insertBefore(placeholder, target);

        rowsBefore.forEach(item => {
          const previousTop = positions.get(item);
          const currentTop = item.getBoundingClientRect().top;
          const offset = previousTop - currentTop;

          if (offset === 0) {
            return;
          }

          item.style.transition = "none";
          item.style.transform = `translateY(${offset}px)`;
          requestAnimationFrame(() => {
            item.style.transition = "transform 120ms ease";
            item.style.transform = "";
          });
        });
      }
    }

    function finishOptionalDrag() {
      pendingDrag = null;

      if (!dragState) {
        return;
      }

      const { row, placeholder, category } = dragState;
      const targetGroup = row.parentElement;

      targetGroup.insertBefore(row, placeholder);
      placeholder.remove();

      row.classList.remove("dragging");
      row.style.width = "";
      row.style.height = "";
      row.style.left = "";
      row.style.top = "";
      row.style.transform = "";

      dragState = null;
      renumberOptionalRows(category);
    }

    function createOptionalRow(category) {
      const row = document.createElement("div");
      row.className = "optional-row";

      const categorySelect = createSelect(
        CALCULATOR_DATA.categories,
        category,
        () => moveOptionalRow(row, categorySelect.value)
      );

      const descriptionSelect = createSelect(
        CALCULATOR_DATA.optionalDescriptions[category],
        CALCULATOR_DATA.optionalDescriptions[category][0],
        null
      );

      descriptionSelect.dataset.baseDescription = descriptionSelect.value;

      descriptionSelect.addEventListener("change", () => {
        descriptionSelect.dataset.baseDescription = descriptionSelect.value;
        renumberOptionalRows(category);
      });

      const valueInput = createValueInput();

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "action-button delete-button";
      deleteButton.textContent = "X";
      deleteButton.addEventListener("click", () => {
        if (valueInput.value.trim() !== "") {
          const shouldDelete = window.confirm(
            "계산에 적용중인 데이터가 남아 있습니다. 삭제하시겠습니까?"
          );

          if (!shouldDelete) {
            return;
          }
        }

        row.remove();
        renumberOptionalRows(categorySelect.value);
      });

      row.append(categorySelect, descriptionSelect, valueInput, deleteButton);

      row.addEventListener("pointerdown", event => {
        startOptionalDrag(row, event);
      });

      row.addEventListener("pointermove", event => {
        updateOptionalDrag(event);
      });

      row.addEventListener("pointerup", finishOptionalDrag);
      row.addEventListener("pointercancel", finishOptionalDrag);
      return row;
    }

    function moveOptionalRow(row, category) {
      const targetGroup = groups.get(category);

      if (!targetGroup) {
        return;
      }

      const oldDescriptionSelect = row.children[1];
      const selectedDescription = oldDescriptionSelect.value;
      const availableDescriptions = CALCULATOR_DATA.optionalDescriptions[category];

      if (availableDescriptions.length === 0) {
        return;
      }

      oldDescriptionSelect.replaceWith(
        createSelect(
          availableDescriptions,
          availableDescriptions.includes(selectedDescription)
            ? selectedDescription
            : availableDescriptions[0],
          null
        )
      );

      const newDescriptionSelect = row.children[1];
      newDescriptionSelect.dataset.baseDescription = newDescriptionSelect.value;

      newDescriptionSelect.addEventListener("change", () => {
        newDescriptionSelect.dataset.baseDescription = newDescriptionSelect.value;
        renumberOptionalRows(category);
      });

      const addButton = targetGroup.querySelector(".add-button");
      targetGroup.insertBefore(row, addButton);
      renumberOptionalRows(category);
    }

    function addOptionalRow(category) {
      const availableDescriptions = CALCULATOR_DATA.optionalDescriptions[category];

      if (availableDescriptions.length === 0) {
        return;
      }

      const targetGroup = groups.get(category);
      const addButton = targetGroup.querySelector(".add-button");
      const row = createOptionalRow(category);
      targetGroup.insertBefore(row, addButton);
      renumberOptionalRows(category);
    }

    function createAddButton(category) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "action-button add-button";
      button.textContent = "+";
      button.addEventListener("click", () => addOptionalRow(category));
      return button;
    }

    function initialize() {
      setColumnWidths();
      CALCULATOR_DATA.categories.forEach(createGroup);

      CALCULATOR_DATA.categories.forEach(category => {
        CALCULATOR_DATA.requiredDescriptions[category].forEach(description => {
          groups.get(category).appendChild(
            createRequiredRow({ category, description })
          );
        });
      });

      CALCULATOR_DATA.categories.forEach(category => {
        groups.get(category).appendChild(createAddButton(category));
      });
    }

    initialize();
  </script>
</body>
</html>
