<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <div class="page-header" id="page-header">
    <div class="header-cover-layer" aria-hidden="true"></div>
    <h1 aria-label="마비노기 모바일 계산기"><span>마비노기</span><span>모바일</span><span>계산기</span></h1>
<script>
  (() => {
    const title = document.querySelector("h1");
    if (!title) return;

    let titleHeightTransitionToken = 0;
    let clearTitleHeightTransition = null;

    const updateTitleLayout = () => {
      const width = title.getBoundingClientRect().width;
      title.dataset.titleVisibility = width <= 125 ? "hidden" : "visible";
      const layout = width < 210 ? "three" : width < 325 ? "two" : "single";
      if (title.dataset.titleLayout === layout) return;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const beforeTitleHeight = title.getBoundingClientRect().height;
      const words = [...title.querySelectorAll("span")];
      const beforeRects = new Map(
        words.map(word => [word, word.getBoundingClientRect()])
          .filter(([, rect]) => rect.width > 0 && rect.height > 0)
      );

      const transitionToken = ++titleHeightTransitionToken;
      if (clearTitleHeightTransition) {
        title.removeEventListener("transitionend", clearTitleHeightTransition);
        clearTitleHeightTransition = null;
      }

      title.dataset.titleLayout = layout;

      // 이전 전환에서 남아 있을 수 있는 고정 높이를 먼저 제거해 새 목표 높이를 측정합니다.
      title.style.removeProperty("height");
      const afterTitleHeight = title.getBoundingClientRect().height;

      if (reducedMotion) return;

      if (Math.abs(afterTitleHeight - beforeTitleHeight) > 1) {
        title.style.height = `${beforeTitleHeight}px`;
        title.getBoundingClientRect();

        const clearHeight = event => {
          if (
            event.target !== title ||
            event.propertyName !== "height" ||
            transitionToken !== titleHeightTransitionToken
          ) return;
          title.style.removeProperty("height");
          title.removeEventListener("transitionend", clearHeight);
          if (clearTitleHeightTransition === clearHeight) {
            clearTitleHeightTransition = null;
          }
        };
        clearTitleHeightTransition = clearHeight;
        title.addEventListener("transitionend", clearHeight);

        requestAnimationFrame(() => {
          if (transitionToken !== titleHeightTransitionToken) return;
          title.style.height = `${afterTitleHeight}px`;
        });
      }

      const animations = [];
      words.forEach(word => {
        const before = beforeRects.get(word);
        const after = word.getBoundingClientRect();
        if (!before || after.width === 0 || after.height === 0) return;

        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

        word.style.transition = "none";
        word.style.transform = `translate(${dx}px, ${dy}px)`;
        word.getBoundingClientRect();
        animations.push(word);
      });

      requestAnimationFrame(() => {
        if (transitionToken !== titleHeightTransitionToken) return;
        animations.forEach(word => {
          const clearAnimation = event => {
            if (event.target !== word || event.propertyName !== "transform") return;
            word.style.removeProperty("transition");
            word.style.removeProperty("transform");
            word.removeEventListener("transitionend", clearAnimation);
          };
          word.addEventListener("transitionend", clearAnimation);
          word.style.transition = "transform 280ms cubic-bezier(.22,.72,.22,1)";
          word.style.transform = "translate(0, 0)";
        });
      });
    };

    updateTitleLayout();
    if ("ResizeObserver" in window) {
      new ResizeObserver(updateTitleLayout).observe(title);
    } else {
      window.addEventListener("resize", updateTitleLayout);
    }
  })();
</script>

<script>
  (() => {
    const themeToggle = document.getElementById("theme-toggle");
    if (!themeToggle) return;

    const getSavedDarkMode = () => {
      const cookieValue = document.cookie
        .split(";")
        .map((item) => item.trim())
        .find((item) => item.startsWith("darkmode="));
      return cookieValue ? cookieValue.slice("darkmode=".length) === "true" : false;
    };

    const saveDarkMode = (isDark) => {
      document.cookie = `darkmode=${isDark}; Max-Age=315360000; Path=/; SameSite=Lax${location.protocol === "https:" ? "; Secure" : ""}`;
    };

    const updateButton = (isDark) => {
      themeToggle.classList.toggle("is-dark", isDark);
      document.body.dataset.theme = isDark ? "dark" : "light";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      const nextLabel = isDark ? "라이트모드로 전환" : "다크모드로 전환";
      themeToggle.setAttribute("aria-label", nextLabel);
      themeToggle.setAttribute("title", nextLabel);
    };

    updateButton(getSavedDarkMode());

    themeToggle.addEventListener("click", () => {
      const isDark = !themeToggle.classList.contains("is-dark");
      saveDarkMode(isDark);
      updateButton(isDark);
    });
  })();
</script>

<script>
  (() => {
    const initializeKeyboardShortcuts = () => {
      const themeToggle = document.getElementById("theme-toggle");
      const pagination = document.getElementById("full-page-pagination");
      if (!themeToggle || !pagination) return;

      const options = [...pagination.querySelectorAll(".full-page-pagination-option")];
      const isEditableTarget = target =>
        target instanceof Element &&
        (target.isContentEditable || target.closest('input, textarea, select, [contenteditable="true"], [role="textbox"]'));

      document.addEventListener("keydown", event => {
        if (event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        if (isEditableTarget(event.target)) return;

        const visibleModal = [...document.querySelectorAll('[role="dialog"][aria-modal="true"]')]
          .some(dialog => dialog.getClientRects().length > 0);
        if (visibleModal) return;

        const key = event.key.toLowerCase();
        if (key === "d") {
          event.preventDefault();
          themeToggle.click();
          return;
        }

        if (key !== "q" && key !== "w") return;
        const currentIndex = options.findIndex(option => option.getAttribute("aria-pressed") === "true");
        if (currentIndex < 0) return;

        const nextIndex = Math.max(0, Math.min(options.length - 1, currentIndex + (key === "q" ? -1 : 1)));
        if (nextIndex === currentIndex) return;

        event.preventDefault();
        options[nextIndex].click();
      });
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeKeyboardShortcuts, { once: true });
    } else {
      initializeKeyboardShortcuts();
    }
  })();
</script>

  <script>
  (() => {
    const header = document.getElementById("page-header");
    const toggle = document.getElementById("header-collapse-toggle");
    const controlled = [
      header?.querySelector("h1"),
      header?.querySelector(".data-action-buttons"),
      document.getElementById("theme-toggle")
    ].filter(Boolean);
    if (!header || !toggle) return;

    const setCollapsed = collapsed => {
      header.classList.toggle("is-collapsed", collapsed);
      toggle.setAttribute("aria-expanded", String(!collapsed));
      const label = collapsed ? "상단 메뉴 펼치기" : "상단 메뉴 접기";
      toggle.setAttribute("aria-label", label);
      toggle.setAttribute("title", label);
      controlled.forEach(element => {
        if (collapsed) {
          element.setAttribute("inert", "");
          element.setAttribute("aria-hidden", "true");
        } else {
          element.removeAttribute("inert");
          element.removeAttribute("aria-hidden");
        }
      });
    };

    toggle.addEventListener("click", () => {
      setCollapsed(!header.classList.contains("is-collapsed"));
    });
  })();
  </script>

  <script>
    (() => {


      const pagination = document.getElementById("full-page-pagination");
      const stage = document.getElementById("page-content-stage");
      if (!pagination || !stage) return;

      const options = [...pagination.querySelectorAll(".full-page-pagination-option")];
      const pages = {
        stats: document.getElementById("table-area"),
        runes: document.getElementById("runes-page"),
        equipment: document.getElementById("equipment-page"),
        other: document.getElementById("other-page")
      };
      const pageOrder = options.map((option) => option.dataset.page);
      const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let currentPage = "stats";
      let transitionToken = 0;
      let activeAnimations = [];

      const settlePage = (pageKey) => {
        Object.entries(pages).forEach(([key, panel]) => {
          if (!panel) return;
          panel.hidden = key !== pageKey;
          panel.style.removeProperty("position");
          panel.style.removeProperty("inset");
          panel.style.removeProperty("width");
          panel.style.removeProperty("opacity");
          panel.style.removeProperty("transform");
        });
        stage.classList.remove("is-transitioning");
        stage.style.removeProperty("height");
      };

      options.forEach((option) => {
        option.addEventListener("click", () => {
          const nextPage = option.dataset.page;
          if (!pages[nextPage] || nextPage === currentPage) return;

          options.forEach((item) => {
            const selected = item === option;
            item.classList.toggle("is-active", selected);
            item.setAttribute("aria-pressed", String(selected));
          });

          const previousPage = currentPage;
          const outgoing = pages[previousPage];
          const incoming = pages[nextPage];
          const token = ++transitionToken;
          activeAnimations.forEach((animation) => animation.cancel());
          activeAnimations = [];
          settlePage(previousPage);
          currentPage = nextPage;

          if (reduceMotion()) {
            settlePage(nextPage);
            return;
          }

          const outgoingStageHeight = stage.getBoundingClientRect().height;
          incoming.hidden = false;
          const incomingHeight = incoming.getBoundingClientRect().height;
          const stageStyle = getComputedStyle(stage);
          const incomingStyle = getComputedStyle(incoming);
          const stagePaddingTop = parseFloat(stageStyle.paddingTop) || 0;
          const incomingMarginTop = parseFloat(incomingStyle.marginTop) || 0;
          const incomingStageHeight = incomingHeight + stagePaddingTop + incomingMarginTop;
          incoming.style.position = "absolute";
          incoming.style.inset = `${stagePaddingTop}px 0 0`;
          stage.classList.add("is-transitioning");
          stage.style.height = `${outgoingStageHeight}px`;
          outgoing.style.position = "absolute";
          outgoing.style.inset = `${stagePaddingTop}px 0 0`;
          stage.getBoundingClientRect();

          const previousIndex = pageOrder.indexOf(previousPage);
          const nextIndex = pageOrder.indexOf(nextPage);
          const incomingOffset = nextIndex < previousIndex ? -32 : 32;
          const exitAnimation = outgoing.animate(
            [
              { opacity: 1, transform: "translateY(0) scale(1)" },
              { opacity: 0, transform: "translateY(24px) scale(0.94)" }
            ],
            { duration: 260, easing: "cubic-bezier(.22,.72,.22,1)", fill: "forwards" }
          );
          const enterAnimation = incoming.animate(
            [
              { opacity: 0, transform: `translateX(${incomingOffset}px)` },
              { opacity: 1, transform: "translateX(0)" }
            ],
            { duration: 260, delay: 100, easing: "cubic-bezier(.22,.72,.22,1)", fill: "both" }
          );
          const stageAnimation = stage.animate(
            [{ height: `${outgoingStageHeight}px` }, { height: `${incomingStageHeight}px` }],
            { duration: 260, delay: 100, easing: "cubic-bezier(.22,.72,.22,1)", fill: "forwards" }
          );
          activeAnimations = [exitAnimation, enterAnimation, stageAnimation];

          Promise.allSettled(activeAnimations.map((animation) => animation.finished)).then(() => {
            if (token !== transitionToken) return;
            activeAnimations.forEach((animation) => animation.cancel());
            activeAnimations = [];
            settlePage(nextPage);
          });
        });
      });
    })();
  </script>

  <script>
    (() => {
      const runesPage = document.getElementById("runes-page");
      const selectBox = document.getElementById("runes-select-box");
      const searchBox = document.getElementById("runes-search-box");
      if (!runesPage || !selectBox || !searchBox) return;

      const boxes = [selectBox, searchBox];
      const duration = 260;
      let previousStacked = null;
      let activeAnimations = [];

      function updateRunesLayout(animate = true) {
        const before = boxes.map(box => box.getBoundingClientRect());
        const stacked = runesPage.clientWidth < 800;
        if (previousStacked === null || stacked === previousStacked) {
          runesPage.classList.toggle("is-stacked", stacked);
          previousStacked = stacked;
          return;
        }

        activeAnimations.forEach(animation => animation.cancel());
        activeAnimations = [];
        runesPage.classList.toggle("is-stacked", stacked);
        const after = boxes.map(box => box.getBoundingClientRect());
        if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          previousStacked = stacked;
          return;
        }

        boxes.forEach((box, index) => {
          const dx = before[index].left - after[index].left;
          const dy = before[index].top - after[index].top;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
          const animation = box.animate(
            [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0, 0)" }],
            { duration, easing: "cubic-bezier(.22,.72,.22,1)" }
          );
          animation.onfinish = () => {
            animation.cancel();
            activeAnimations = activeAnimations.filter(item => item !== animation);
          };
          activeAnimations.push(animation);
        });
        previousStacked = stacked;
      }

      const observer = new MutationObserver(() => {
        if (!runesPage.hidden) requestAnimationFrame(() => updateRunesLayout(false));
      });
      observer.observe(runesPage, { attributes: true, attributeFilter: ["hidden"] });
      window.addEventListener("resize", () => {
        if (!runesPage.hidden) requestAnimationFrame(() => updateRunesLayout(true));
      });
    })();
  </script>

        on: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3.5h14a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5Z" fill="none" stroke="#2eaa59" stroke-width="2"/><path d="m7 12 3.2 3.2L17.5 8" fill="none" stroke="#2eaa59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };
      function renderSelectedRunes() {

            <button class="rune-sort-button" type="button" aria-label="정렬 순서: 가나다순. 눌러서 가나다 역순으로 변경" aria-pressed="false">
              <svg class="rune-sort-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3.5" y1="6" x2="13.5" y2="6"/><line x1="3.5" y1="10.5" x2="11.5" y2="10.5"/><line x1="3.5" y1="15" x2="9.5" y2="15"/><path d="M17 5v13m-4-4 4 4 4-4"/></g></svg>

          </div>
        </section>
        <div class="rune-table-wrap"><table class="rune-table"><tbody class="rune-table-body"></tbody></table></div>
        <nav class="rune-pagination is-empty" aria-label="룬 검색 결과 페이지" aria-hidden="true"></nav>
      `;
      const tableBody = box.querySelector(".rune-table-body");
      const overlay = document.createElement("div");
      overlay.className = "rune-description-overlay";

        </section>`;
      document.body.appendChild(overlay);
      const dialogTitle=overlay.querySelector(".rune-description-title"), dialogMeta=overlay.querySelector(".rune-description-meta"), dialogText=overlay.querySelector(".rune-description-text"), closeButton=overlay.querySelector(".rune-description-close");
      const searchInput=box.querySelector(".rune-search-input"), pagination=box.querySelector(".rune-pagination"), sortToggleButton=box.querySelector(".rune-sort-button");
      const PAGE_SIZE=10, activeFilters={grade:new Set(["신화","전설"]),slot:new Set(["무기","방어구","엠블럼"])};
      let sortDirection="asc", currentPage=1;
      function closeDescription(){overlay.hidden=true;}
      function showCapacityNotice(){dialogTitle.textContent="방어구 룬 선택";dialogMeta.textContent="선택 제한";dialogText.textContent="방어구 룬은 최대 5개까지 선택할 수 있습니다.";overlay.hidden=false;closeButton.focus();}
      function openDescription(rune){dialogTitle.textContent=rune.name??"";dialogMeta.textContent=rune.slot??"";dialogText.textContent=rune.desc??"";overlay.hidden=false;closeButton.focus();}
      function getFilteredRunes(){
        const query=searchInput.value.trim().toLocaleLowerCase("ko-KR");
        return RUNES.items.filter(rune=>activeFilters.grade.has(rune.grade)&&activeFilters.slot.has(rune.slot))
          .filter(rune=>!query||`${rune.name??""} ${rune.desc??""}`.toLocaleLowerCase("ko-KR").includes(query))
          .sort((a,b)=>{const result=(a.name??"").localeCompare(b.name??"","ko-KR");return sortDirection==="asc"?result:-result;});
      }
      function createPageButton(label,page,options={}){
        const button=document.createElement("button");button.type="button";button.className="rune-page-button";
        if(options.arrow){button.setAttribute("aria-label",label);button.innerHTML=options.arrow==="left"
          ?'<svg class="rune-page-arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          :'<svg class="rune-page-arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9.5 5.5 6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }else button.textContent=label;
        if(options.current)button.setAttribute("aria-current","page");if(options.disabled)button.disabled=true;
        if(!options.disabled&&!options.current)button.addEventListener("click",()=>{currentPage=page;renderRunes();});return button;
      }
      function renderPagination(totalPages){
        const nextNodes=[],isEmpty=totalPages<=1,oldRect=pagination.getBoundingClientRect();pagination.setAttribute("aria-hidden",String(isEmpty));
        if(!isEmpty){
          if(currentPage>1)nextNodes.push(createPageButton("이전",currentPage-1,{arrow:"left"}));
          nextNodes.push(createPageButton("1",1,{current:currentPage===1}));
          if(currentPage>3){const e=document.createElement("span");e.className="rune-page-ellipsis";e.textContent="...";nextNodes.push(e);}
          if(currentPage>1&&currentPage<totalPages){
            if(currentPage-1>1)nextNodes.push(createPageButton(String(currentPage-1),currentPage-1));
            nextNodes.push(createPageButton(String(currentPage),currentPage,{current:true}));
            if(currentPage+1<totalPages)nextNodes.push(createPageButton(String(currentPage+1),currentPage+1));
          }else if(currentPage===1&&totalPages>2)nextNodes.push(createPageButton("2",2));
          else if(currentPage===totalPages&&totalPages>2)nextNodes.push(createPageButton(String(totalPages-1),totalPages-1));
          if(currentPage<totalPages-2){const e=document.createElement("span");e.className="rune-page-ellipsis";e.textContent="...";nextNodes.push(e);}
          nextNodes.push(createPageButton(String(totalPages),totalPages,{current:currentPage===totalPages}));
          if(currentPage<totalPages)nextNodes.push(createPageButton("다음",currentPage+1,{arrow:"right"}));
        }
        const oldNodes=[...pagination.children].filter(node=>!node.classList.contains("rune-pagination-exit")),key=node=>(node.getAttribute("aria-label")||node.textContent)+"|"+node.className,oldRects=new Map();
        for(const node of oldNodes){const k=key(node);if(!oldRects.has(k))oldRects.set(k,[]);oldRects.get(k).push(node.getBoundingClientRect());}
        const oldKeys=new Set(oldNodes.map(key)),nextKeys=new Set(nextNodes.map(key)),outgoing=[];
        for(const node of oldNodes){if(nextKeys.has(key(node)))continue;const rect=node.getBoundingClientRect(),clone=node.cloneNode(true),computed=getComputedStyle(node);
          Object.assign(clone.style,{left:`${rect.left-oldRect.left}px`,top:`${rect.top-oldRect.top}px`,width:`${rect.width}px`,height:`${rect.height}px`,boxSizing:"border-box",font:computed.font,transform:"none",transition:"none"});clone.classList.add("rune-pagination-exit");outgoing.push(clone);}
        pagination.replaceChildren(...nextNodes,...outgoing);pagination.classList.toggle("is-empty",isEmpty);
        for(const clone of outgoing)clone.animate([{opacity:1},{opacity:0}],{duration:260,easing:"ease-out",fill:"forwards"}).onfinish=()=>clone.remove();
        requestAnimationFrame(()=>{for(const node of nextNodes){const previous=oldRects.get(key(node));
          if(node.hasAttribute("aria-label")&&(node.getAttribute("aria-label")==="이전"||node.getAttribute("aria-label")==="다음")){if(!oldKeys.has(key(node)))node.animate([{opacity:0},{opacity:1}],{duration:260,easing:"ease-out",fill:"both"});continue;}if(previous?.length){const rect=previous.shift(),next=node.getBoundingClientRect(),dx=rect.left-next.left,dy=rect.top-next.top;
            if(Math.abs(dx)>=1||Math.abs(dy)>=1)node.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],{duration:260,easing:"cubic-bezier(.22,.72,.22,1)"});
          }else if(!oldKeys.has(key(node)))node.animate([{opacity:0},{opacity:1}],{duration:260,easing:"ease-out",fill:"both"});}});
      }
      function renderRunes(){
        const before=[...box.children].map(element=>({element,rect:element.getBoundingClientRect()})),filtered=getFilteredRunes(),totalPages=Math.ceil(filtered.length/PAGE_SIZE);
        currentPage=Math.max(1,Math.min(currentPage,totalPages||1));tableBody.replaceChildren();
        for(const rune of filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE)){
          const row=document.createElement("tr");row.dataset.grade=rune.grade??"";row.tabIndex=0;row.setAttribute("aria-label",`${rune.name??"이름 없는 룬"} 설명 보기`);
          const slot=document.createElement("td");slot.className="rune-slot";slot.textContent=rune.slot??"";
          const name=document.createElement("td");name.className="rune-name";name.textContent=rune.name??"";
          const actionCell=document.createElement("td");actionCell.className="rune-select-cell";
          const selectButton=document.createElement("button");selectButton.type="button";selectButton.className="rune-select-toggle";
          const values=selectedRunes[rune.slot]||[], isSelected=values.includes(rune.name);
          selectButton.classList.toggle("is-selected",isSelected);selectButton.setAttribute("aria-pressed",String(isSelected));
          selectButton.setAttribute("aria-label",isSelected?rune.name+" 선택 해제":rune.name+" 선택");selectButton.innerHTML=isSelected?selectionIcons.on:selectionIcons.off;
          selectButton.addEventListener("click",event=>{
            event.stopPropagation(); const list=selectedRunes[rune.slot]; if(!list)return;
            const index=list.indexOf(rune.name);
            if(index>=0) list.splice(index,1);
            else if(list.length>=slotLimits[rune.slot]) { if(rune.slot==="방어구") showCapacityNotice(); return; }
            else if(rune.slot==="무기"||rune.slot==="엠블럼") list.splice(0,list.length,rune.name);
            else list.push(rune.name);
            renderSelectedRunes();renderRunes();
          });
          actionCell.appendChild(selectButton);row.append(slot,name,actionCell);
          row.addEventListener("click",()=>openDescription(rune));row.addEventListener("keydown",event=>{if(event.target!==row||(event.key!=="Enter"&&event.key!==" "))return;event.preventDefault();openDescription(rune);});tableBody.appendChild(row);
        }
        renderPagination(totalPages);
        requestAnimationFrame(()=>{for(const {element,rect} of before){if(!element.isConnected)continue;const next=element.getBoundingClientRect(),dx=rect.left-next.left,dy=rect.top-next.top;
          if(Math.abs(dx)<1&&Math.abs(dy)<1)continue;element.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],{duration:260,easing:"cubic-bezier(.22,.72,.22,1)"});}});
      }
      box.querySelectorAll("[data-filter-group]").forEach(button=>button.addEventListener("click",()=>{
        const set=activeFilters[button.dataset.filterGroup],value=button.dataset.filterValue;
        if(set.has(value)){set.delete(value);button.setAttribute("aria-pressed","false");}else{set.add(value);button.setAttribute("aria-pressed","true");}
        currentPage=1;renderRunes();
      }));
      searchInput.addEventListener("input",()=>{currentPage=1;renderRunes();});
      sortToggleButton.addEventListener("click",()=>{sortDirection=sortDirection==="asc"?"desc":"asc";
        sortToggleButton.querySelector(".rune-sort-icon").style.transform=sortDirection==="desc"?"scaleY(-1)":"scaleY(1)";
        sortToggleButton.setAttribute("aria-pressed",String(sortDirection==="desc"));
        sortToggleButton.setAttribute("aria-label",sortDirection==="asc"?"정렬 순서: 가나다순. 눌러서 가나다 역순으로 변경":"정렬 순서: 가나다 역순. 눌러서 가나다순으로 변경");
        currentPage=1;renderRunes();});
      overlay.addEventListener("click",event=>{if(event.target===overlay)closeDescription();});
      closeButton.addEventListener("click",closeDescription);
      document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!overlay.hidden)closeDescription();});
      renderRunes();
    })();
  </script>
