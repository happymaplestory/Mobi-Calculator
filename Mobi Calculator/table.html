<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마비노기 모바일 계산기</title>
  <link rel="stylesheet" href="pages_css/table.css">
</head>
<body>
  <div class="page-header" id="page-header">
    <h1 aria-label="마비노기 모바일 계산기"><span>마비노기</span><span>모바일</span><span>계산기</span></h1>
<script>
  (() => {
    const title = document.querySelector("h1");
    if (!title) return;

    const updateTitleLayout = () => {
      const width = title.getBoundingClientRect().width;
      const layout = width < 210 ? "three" : width < 325 ? "two" : "single";
      if (title.dataset.titleLayout === layout) return;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const words = [...title.querySelectorAll("span")];
      const beforeRects = new Map(
        words.map(word => [word, word.getBoundingClientRect()])
          .filter(([, rect]) => rect.width > 0 && rect.height > 0)
      );

      title.dataset.titleLayout = layout;
      if (reducedMotion) return;

      const animations = [];
      words.forEach(word => {
        const before = beforeRects.get(word);
        const after = word.getBoundingClientRect();
        if (!before || after.width === 0 || after.height === 0) return;

        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

        word.style.transition = "none";
        word.style.transform = `translate(${dx}px, ${dy}px)`;
        word.getBoundingClientRect();
        animations.push(word);
      });

      requestAnimationFrame(() => {
        animations.forEach(word => {
          const clearAnimation = event => {
            if (event.target !== word || event.propertyName !== "transform") return;
            word.style.removeProperty("transition");
            word.style.removeProperty("transform");
            word.removeEventListener("transitionend", clearAnimation);
          };
          word.addEventListener("transitionend", clearAnimation);
          word.style.transition = "transform 280ms cubic-bezier(.22,.72,.22,1)";
          word.style.transform = "translate(0, 0)";
        });
      });
    };

    updateTitleLayout();
    if ("ResizeObserver" in window) {
      new ResizeObserver(updateTitleLayout).observe(title);
    } else {
      window.addEventListener("resize", updateTitleLayout);
    }
  })();
</script>

    <div class="data-action-buttons" aria-label="데이터 저장 및 불러오기">
      <div class="data-action-item" id="save-action-item">
        <button id="save-button" class="data-action-button" type="button" aria-expanded="false" aria-controls="save-submenu">저장</button>
        <div id="save-submenu" class="data-action-submenu" hidden>
          <button id="save-browser-button" class="data-action-submenu-button" type="button">브라우저</button>
          <button id="save-file-button" class="data-action-submenu-button" type="button">파일</button>
        </div>
      </div>
      <div class="data-action-item" id="load-action-item">
        <button id="load-button" class="data-action-button" type="button" aria-expanded="false" aria-controls="load-submenu">불러오기</button>
        <div id="load-submenu" class="data-action-submenu" hidden>
          <button id="load-browser-button" class="data-action-submenu-button" type="button">브라우저</button>
          <button id="load-file-button" class="data-action-submenu-button" type="button">파일</button>
        </div>
      </div>
    </div>

    <button id="theme-toggle" class="theme-toggle-button" type="button" aria-label="다크모드로 전환" title="다크모드로 전환" aria-pressed="false"><svg class="theme-toggle-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="theme-icon-moon" d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8 8.7 8.7 0 1 0 20.2 14.6Z" fill="#d0cda9" stroke="#c3c09f" stroke-width="0.6" stroke-linejoin="round"/><g class="theme-icon-sun" fill="none" stroke="#f1d88b" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#f1d88b" stroke="none"/><path d="M12 2.5v2.1M12 19.4v2.1M2.5 12h2.1M19.4 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></g></svg></button>
<script>
  (() => {
    const themeToggle = document.getElementById("theme-toggle");
    if (!themeToggle) return;

    const getSavedDarkMode = () => {
      const cookieValue = document.cookie
        .split(";")
        .map((item) => item.trim())
        .find((item) => item.startsWith("darkmode="));
      return cookieValue ? cookieValue.slice("darkmode=".length) === "true" : false;
    };

    const saveDarkMode = (isDark) => {
      document.cookie = `darkmode=${isDark}; Max-Age=315360000; Path=/; SameSite=Lax${location.protocol === "https:" ? "; Secure" : ""}`;
    };

    const updateButton = (isDark) => {
      themeToggle.classList.toggle("is-dark", isDark);
      document.body.dataset.theme = isDark ? "dark" : "light";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      const nextLabel = isDark ? "라이트모드로 전환" : "다크모드로 전환";
      themeToggle.setAttribute("aria-label", nextLabel);
      themeToggle.setAttribute("title", nextLabel);
    };

    updateButton(getSavedDarkMode());

    themeToggle.addEventListener("click", () => {
      const isDark = !themeToggle.classList.contains("is-dark");
      saveDarkMode(isDark);
      updateButton(isDark);
    });
  })();
</script>

  <nav id="full-page-pagination" class="full-page-pagination" aria-label="페이지 선택">
    <button class="full-page-pagination-option is-active" type="button" aria-pressed="true">스탯</button>
    <button class="full-page-pagination-option" type="button" aria-pressed="false">룬</button>
    <button class="full-page-pagination-option" type="button" aria-pressed="false">장비</button>
    <button class="full-page-pagination-option" type="button" aria-pressed="false">기타</button>
  </nav>
  <script>
    (() => {
      const pagination = document.getElementById("full-page-pagination");
      if (!pagination) return;
      const options = [...pagination.querySelectorAll(".full-page-pagination-option")];
      options.forEach((option) => {
        option.addEventListener("click", () => {
          options.forEach((item) => {
            const selected = item === option;
            item.classList.toggle("is-active", selected);
            item.setAttribute("aria-pressed", String(selected));
          });
        });
      });
    })();
  </script>
  </div>

  <div id="table-area" class="table-area"></div>

  <script src="pages_js/data-model.js"></script>
  <script src="pages_js/table.js"></script>
  <script src="pages_js/storage-manager.js"></script>
</body>
</html>
